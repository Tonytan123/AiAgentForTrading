alpaca:
  api_key: "YOUR_ALPACA_API_KEY"
  secret_key: "YOUR_ALPACA_SECRET_KEY"
  paper: true

featherless:
  base_url: "https://api.featherless.ai/v1"
  api_key: "YOUR_FEATHERLESS_API_KEY"
  model: "Qwen/Qwen2.5-72B-Instruct"

fred:
  api_key: "YOUR_FRED_API_KEY"

risk:
  max_single_position_pct: 0.048  # 单仓上限 4.8%
  max_sector_exposure_pct: 0.30   # 板块敞口上限 30%
  max_drawdown_limit_pct: 0.05    # 单日最大回撤熔断 5%
  max_leverage: 1.0               # 最大杠杆率

strategy:
  take_profit_multiplier: 1.08    # +8% TP
  stop_loss_multiplier: 0.96      # -4% SL
  consensus_threshold: 0.70       # 辩论共识入场分阈值

cash_management:
  enabled: true
  vehicle_symbol: "SGOV"          # 超短期美债 ETF (iShares 0-3 Month Treasury Bond ETF)
  reserve_cash: 500.0             # 安全备用现金 (美元)
  annual_yield: 0.045             # 预期年化无风险收益率 4.5%
  auto_sweep: true                # 开启闲置资金自动清扫

